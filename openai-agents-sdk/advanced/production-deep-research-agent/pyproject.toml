[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "production-deep-research-agent"
version = "0.1.0"
description = "A production-oriented, evidence-first deep research system built with the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "thejenilsoni", email = "work.jenilsoni@gmail.com" }]
dependencies = [
  "openai-agents==0.18.3",
  "openai==2.45.0",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.1,<2",
  "streamlit>=1.48,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[project.scripts]
deep-research = "deep_research_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research_agent"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = true
packages = ["deep_research_agent"]
