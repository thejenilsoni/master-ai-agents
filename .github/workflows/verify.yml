name: Verify projects

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-verify.txt

      # No API key, no network calls to a model provider, no spend -- which is
      # what makes verifying the whole repository practical on every pull
      # request. The two libraries below are the only third-party packages any
      # self-test needs; see requirements-verify.txt for why they are there.
      - name: Install what the self-tests need
        run: pip install --quiet -r requirements-verify.txt

      - name: Verify every project
        run: python scripts/verify_projects.py
