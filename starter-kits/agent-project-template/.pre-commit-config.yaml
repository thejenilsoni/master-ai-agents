# pip install pre-commit && pre-commit install
#
# Deliberately fast: formatting and obvious mistakes only. Type checking and
# tests belong in `make check`, not in something that runs on every commit --
# a slow hook is a hook people learn to skip with --no-verify.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
